name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify-release-contract
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      commit: ${{ steps.contract.outputs.commit }}
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, owner, version, main ancestry, CI, and HIL
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          if ! jq -e --arg actor "$RELEASE_ACTOR" '.allowedActors | index($actor)' \
            .github/release-signers.json >/dev/null; then
            echo "workflow actor is not in the release allowlist"
            exit 1
          fi
          if [ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]; then
            echo "release tag must be annotated"
            exit 1
          fi

          tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified')" != "true" ]; then
            echo "release tag is not verified by GitHub"
            exit 1
          fi
          tagger_email=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.tagger.email')
          if ! jq -e --arg email "$tagger_email" '.allowedTaggerEmails | index($email)' \
            .github/release-signers.json >/dev/null; then
            echo "verified tagger email is not in the release allowlist"
            exit 1
          fi

          version=${RELEASE_TAG#v}
          if [ "$(jq -r '.version' version.json)" != "$version" ]; then
            echo "tag and version.json do not match"
            exit 1
          fi
          commit=$(git rev-list -n 1 "$RELEASE_TAG")
          git fetch --no-tags origin main
          main_commit=$(git rev-parse origin/main)
          checkout_commit=$(git rev-parse HEAD)
          python3 scripts/check_release_context.py \
            --tag "$RELEASE_TAG" \
            --version-file version.json \
            --tag-commit "$commit" \
            --main-commit "$main_commit" \
            --checkout-commit "$checkout_commit"

          require_success() {
            workflow=$1
            count=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${commit}&status=success&per_page=100" \
              --jq '.workflow_runs | map(select(.conclusion == "success")) | length')
            if [ "$count" -lt 1 ]; then
              echo "no successful ${workflow} run exists for ${commit}"
              exit 1
            fi
          }
          require_success ci.yml
          require_success policy.yml
          require_success hil.yml

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

  native-linux:
    name: release-${{ matrix.id }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            runner: ubuntu-24.04
          - id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - name: Install fixed build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils ca-certificates cmake g++-12 git make ninja-build python3

      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Prepare locked dynamic libusb
        run: >-
          python3 scripts/prepare_libusb.py
          --prefix "${RUNNER_TEMP}/libusb"
          --platform linux
          --architecture "${{ matrix.id == 'linux-x64' && 'x64' || 'arm64' }}"

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DKAIROSBOOT_RELEASE_SYMBOLS=ON \
            "-DKAIROSBOOT_LIBUSB_ROOT=${RUNNER_TEMP}/libusb"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "${RUNNER_TEMP}/install"

      - name: Prove optimized Linux Release install
        run: >-
          python3 scripts/check_release_build.py
          --cache build/CMakeCache.txt
          --install-root "${RUNNER_TEMP}/install"
          --platform "${{ matrix.id }}"
          --configuration Release
          --write-evidence

      - name: Extract symbols and package SDK/CLI
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.id }}
        run: |
          mkdir -p build/symbols dist
          objcopy --only-keep-debug "${RUNNER_TEMP}/install/bin/kairosboot" build/symbols/kairosboot.debug
          objcopy --only-keep-debug "${RUNNER_TEMP}/install/lib/libkairosboot.so.${VERSION}" build/symbols/libkairosboot.debug
          objcopy --only-keep-debug "${RUNNER_TEMP}/install/lib/libusb-1.0.so.0" build/symbols/libusb-1.0.debug
          objcopy --strip-debug "${RUNNER_TEMP}/install/bin/kairosboot"
          objcopy --strip-debug "${RUNNER_TEMP}/install/lib/libkairosboot.so.${VERSION}"
          objcopy --strip-debug "${RUNNER_TEMP}/install/lib/libusb-1.0.so.0"
          objcopy --add-gnu-debuglink=build/symbols/kairosboot.debug "${RUNNER_TEMP}/install/bin/kairosboot"
          objcopy --add-gnu-debuglink=build/symbols/libkairosboot.debug "${RUNNER_TEMP}/install/lib/libkairosboot.so.${VERSION}"
          objcopy --add-gnu-debuglink=build/symbols/libusb-1.0.debug "${RUNNER_TEMP}/install/lib/libusb-1.0.so.0"
          readelf --string-dump=.gnu_debuglink "${RUNNER_TEMP}/install/bin/kairosboot" | grep -F 'kairosboot.debug'
          readelf --string-dump=.gnu_debuglink "${RUNNER_TEMP}/install/lib/libkairosboot.so.${VERSION}" | grep -F 'libkairosboot.debug'
          readelf --string-dump=.gnu_debuglink "${RUNNER_TEMP}/install/lib/libusb-1.0.so.0" | grep -F 'libusb-1.0.debug'
          if readelf -S "${RUNNER_TEMP}/install/lib/libusb-1.0.so.0" | grep -q '\.debug_'; then
            echo "libusb debug sections leaked into the Release runtime"
            exit 1
          fi
          python3 scripts/package_native.py \
            --install-root "${RUNNER_TEMP}/install" \
            --output-dir dist \
            --version "$VERSION" \
            --platform "$PLATFORM" \
            --symbols-root build/symbols

      - name: Smoke exact Linux Release archives
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.id }}
        run: >-
          python3 scripts/smoke_native_archive.py
          --dist dist
          --version "$VERSION"
          --platform "$PLATFORM"
          --generator Ninja

      - name: Upload native install tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.id }}
          path: ${{ runner.temp }}/install
          if-no-files-found: error
          retention-days: 7

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  native-desktop:
    name: release-${{ matrix.id }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2022
            architecture: x64
            dependency-architecture: x64
            deployment-target: ""
            developer-dir: ""
          - id: windows-arm64
            runner: windows-11-arm
            architecture: ARM64
            dependency-architecture: arm64
            deployment-target: ""
            developer-dir: ""
          - id: macos-x64
            runner: macos-15-intel
            architecture: ""
            dependency-architecture: x64
            deployment-target: "14.0"
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - id: macos-arm64
            runner: macos-15
            architecture: ""
            dependency-architecture: arm64
            deployment-target: "14.0"
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Prepare locked dynamic libusb on Windows
        if: runner.os == 'Windows'
        run: >-
          python scripts/prepare_libusb.py
          --prefix "$env:RUNNER_TEMP/libusb"
          --platform windows
          --architecture "${{ matrix.dependency-architecture }}"

      - name: Prepare locked dynamic libusb on macOS
        if: runner.os == 'macOS'
        run: >-
          python3 scripts/prepare_libusb.py
          --prefix "${RUNNER_TEMP}/libusb"
          --platform macos
          --architecture "${{ matrix.dependency-architecture }}"

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022"
          -A ${{ matrix.architecture }}
          -DBUILD_TESTING=ON
          -DKAIROSBOOT_RELEASE_SYMBOLS=ON
          "-DKAIROSBOOT_LIBUSB_ROOT=$env:RUNNER_TEMP/libusb"

      - name: Build, test, and install Windows
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix "${{ runner.temp }}/install"

      - name: Prove optimized Windows Release install
        if: runner.os == 'Windows'
        run: >-
          python scripts/check_release_build.py
          --cache build/CMakeCache.txt
          --install-root "$env:RUNNER_TEMP/install"
          --platform "${{ matrix.id }}"
          --configuration Release
          --write-evidence

      - name: Stage and validate Windows symbols
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $symbols = "build/symbols/Release"
          Copy-Item "$env:RUNNER_TEMP/libusb/symbols/libusb-1.0.pdb" $symbols
          $names = @(Get-ChildItem "$symbols/*.pdb" -File | ForEach-Object Name | Sort-Object)
          $expected = @("kairosboot-cli.pdb", "kairosboot.pdb", "libusb-1.0.pdb")
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $names)
          if ($difference.Count -ne 0) {
            throw "Unexpected Release PDB set: $($names -join ', ')"
          }
          if (Test-Path "$env:RUNNER_TEMP/install/share/kairosboot/libusb/symbols/libusb-1.0.pdb") {
            throw "libusb PDB leaked into the Release SDK install tree"
          }

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DKAIROSBOOT_RELEASE_SYMBOLS=ON
          "-DKAIROSBOOT_LIBUSB_ROOT=${RUNNER_TEMP}/libusb"

      - name: Build, test, and install macOS
        if: runner.os == 'macOS'
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "${RUNNER_TEMP}/install"

      - name: Prove optimized macOS Release install
        if: runner.os == 'macOS'
        run: >-
          python3 scripts/check_release_build.py
          --cache build/CMakeCache.txt
          --install-root "${RUNNER_TEMP}/install"
          --platform "${{ matrix.id }}"
          --configuration Release
          --write-evidence

      - name: Extract macOS symbols
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p build/symbols
          dsymutil "${RUNNER_TEMP}/install/bin/kairosboot" -o build/symbols/kairosboot.dSYM
          dsymutil "${RUNNER_TEMP}/install/lib/libkairosboot.${VERSION}.dylib" -o build/symbols/libkairosboot.dSYM
          cp -R "${RUNNER_TEMP}/libusb/symbols/libusb-1.0.dSYM" build/symbols/
          strip -S "${RUNNER_TEMP}/install/bin/kairosboot"
          strip -S "${RUNNER_TEMP}/install/lib/libkairosboot.${VERSION}.dylib"
          strip -S "${RUNNER_TEMP}/install/lib/libusb-1.0.0.dylib"

      - name: Package SDK, CLI, and symbols
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.id }}
        run: >-
          python3 scripts/package_native.py
          --install-root "${{ runner.temp }}/install"
          --output-dir dist
          --version "$env:VERSION"
          --platform "$env:PLATFORM"
          --symbols-root build/symbols/Release
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Package macOS SDK, CLI, and symbols
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.id }}
        run: >-
          python3 scripts/package_native.py
          --install-root "${RUNNER_TEMP}/install"
          --output-dir dist
          --version "$VERSION"
          --platform "$PLATFORM"
          --symbols-root build/symbols
        if: runner.os == 'macOS'

      - name: Smoke exact Windows Release archives
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.id }}
        run: |
          $cache = Get-Content build/CMakeCache.txt -Raw
          $match = [regex]::Match($cache, '(?m)^CMAKE_DUMPBIN:FILEPATH=(.+)$')
          if (-not $match.Success) {
            $match = [regex]::Match($cache, '(?m)^CMAKE_LINKER:FILEPATH=(.+)$')
          }
          if (-not $match.Success) {
            throw 'Neither CMAKE_DUMPBIN nor CMAKE_LINKER is available'
          }
          $dumpbin = $match.Groups[1].Value.Trim()
          python scripts/smoke_native_archive.py `
            --dist dist `
            --version "$env:VERSION" `
            --platform "$env:PLATFORM" `
            --generator "Visual Studio 17 2022" `
            --architecture "${{ matrix.architecture }}" `
            --dumpbin "$dumpbin"

      - name: Smoke exact macOS Release archives
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.id }}
        run: >-
          python3 scripts/smoke_native_archive.py
          --dist dist
          --version "$VERSION"
          --platform "$PLATFORM"
          --generator Ninja

      - name: Upload native install tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.id }}
          path: ${{ runner.temp }}/install
          if-no-files-found: error
          retention-days: 7

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  dotnet-package:
    name: release-nuget
    needs:
      - verify
      - native-linux
      - native-desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Download all native install trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native

      - name: Stage six native NuGet runtimes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p bindings/dotnet/KairosBoot/runtimes/{win-x64,win-arm64,linux-x64,linux-arm64,osx-x64,osx-arm64}/native
          cp native/native-windows-x64/bin/*.dll bindings/dotnet/KairosBoot/runtimes/win-x64/native/
          mv bindings/dotnet/KairosBoot/runtimes/win-x64/native/kairosboot.dll bindings/dotnet/KairosBoot/runtimes/win-x64/native/kairosboot_native.dll
          cp native/native-windows-arm64/bin/*.dll bindings/dotnet/KairosBoot/runtimes/win-arm64/native/
          mv bindings/dotnet/KairosBoot/runtimes/win-arm64/native/kairosboot.dll bindings/dotnet/KairosBoot/runtimes/win-arm64/native/kairosboot_native.dll
          cp "native/native-linux-x64/lib/libkairosboot.so.${VERSION}" bindings/dotnet/KairosBoot/runtimes/linux-x64/native/libkairosboot_native.so
          cp native/native-linux-x64/lib/libusb-1.0.so.0 bindings/dotnet/KairosBoot/runtimes/linux-x64/native/
          cp "native/native-linux-arm64/lib/libkairosboot.so.${VERSION}" bindings/dotnet/KairosBoot/runtimes/linux-arm64/native/libkairosboot_native.so
          cp native/native-linux-arm64/lib/libusb-1.0.so.0 bindings/dotnet/KairosBoot/runtimes/linux-arm64/native/
          cp "native/native-macos-x64/lib/libkairosboot.${VERSION}.dylib" bindings/dotnet/KairosBoot/runtimes/osx-x64/native/libkairosboot_native.dylib
          cp native/native-macos-x64/lib/libusb-1.0.0.dylib bindings/dotnet/KairosBoot/runtimes/osx-x64/native/
          cp "native/native-macos-arm64/lib/libkairosboot.${VERSION}.dylib" bindings/dotnet/KairosBoot/runtimes/osx-arm64/native/libkairosboot_native.dylib
          cp native/native-macos-arm64/lib/libusb-1.0.0.dylib bindings/dotnet/KairosBoot/runtimes/osx-arm64/native/
          for mapping in \
            win-x64:native-windows-x64 win-arm64:native-windows-arm64 \
            linux-x64:native-linux-x64 linux-arm64:native-linux-arm64 \
            osx-x64:native-macos-x64 osx-arm64:native-macos-arm64; do
            rid=${mapping%%:*}
            artifact=${mapping#*:}
            destination="bindings/dotnet/KairosBoot/runtimes/${rid}/native/licenses/libusb"
            mkdir -p "$destination"
            cp "native/${artifact}/share/kairosboot/libusb/COPYING" "$destination/"
            cp "native/${artifact}/share/kairosboot/libusb/kairosboot-libusb.json" "$destination/"
            boost_destination="bindings/dotnet/KairosBoot/runtimes/${rid}/native/licenses/boost"
            mkdir -p "$boost_destination"
            cp "native/${artifact}/share/kairosboot/boost/LICENSE_1_0.txt" "$boost_destination/"
            miniz_destination="bindings/dotnet/KairosBoot/runtimes/${rid}/native/licenses/miniz"
            mkdir -p "$miniz_destination"
            cp "native/${artifact}/share/kairosboot/miniz/LICENSE" "$miniz_destination/"
            yaml_cpp_destination="bindings/dotnet/KairosBoot/runtimes/${rid}/native/licenses/yaml-cpp"
            mkdir -p "$yaml_cpp_destination"
            cp "native/${artifact}/share/kairosboot/yaml-cpp/LICENSE" "$yaml_cpp_destination/"
          done

      - name: Pack managed SDK with native runtimes and symbols
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          dotnet msbuild bindings/dotnet/KairosBoot/KairosBoot.csproj \
            /restore \
            /t:Pack \
            /p:Configuration=Release \
            /p:ContinuousIntegrationBuild=true \
            /p:Optimize=true \
            /p:PackageOutputPath="$PWD/nuget" \
            /p:Version="$VERSION" \
            /p:PackageVersion="$VERSION" \
            /p:IncludeNativeRuntimes=true \
            /p:NativeRuntimeRoot="$PWD/bindings/dotnet/KairosBoot/runtimes" \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            /m:1 \
            /nr:false
          test -f "$PWD/nuget/KairosBoot.${VERSION}.nupkg"
          test -f "$PWD/nuget/KairosBoot.${VERSION}.snupkg"

      - name: Upload NuGet assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-nuget
          path: |
            nuget/KairosBoot.*.nupkg
            nuget/KairosBoot.*.snupkg
          if-no-files-found: error
          retention-days: 7

  dotnet-package-smoke:
    name: release-managed-${{ matrix.rid }}
    needs:
      - verify
      - dotnet-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2022
          - rid: win-arm64
            runner: windows-11-arm
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            runner: macos-15-intel
          - rid: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Download exact Release NuGet assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-nuget
          path: ${{ runner.temp }}/package

      - name: Smoke exact .NET 10 Release package on Unix
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          package=$(find "${RUNNER_TEMP}/package" -maxdepth 1 -name 'KairosBoot.*.nupkg' ! -name '*.snupkg' -print -quit)
          test -n "$package"
          python3 bindings/dotnet/tests/run_package_smoke.py \
            --package "$package" \
            --framework net10.0 \
            --rid "${{ matrix.rid }}" \
            --expected-native-version "$VERSION"

      - name: Smoke exact .NET 10 Release package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $package = Get-ChildItem "$env:RUNNER_TEMP/package/KairosBoot.*.nupkg" |
            Where-Object { $_.Extension -eq ".nupkg" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $package) { throw "KairosBoot Release NuGet package was not downloaded" }
          python bindings/dotnet/tests/run_package_smoke.py `
            --package $package `
            --framework net10.0 `
            --rid "${{ matrix.rid }}" `
            --expected-native-version "$env:VERSION"

      - name: Locate classic .NET Framework build tools
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "full-framework MSBuild.exe was not found" }
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) { throw "nuget.exe was not found on PATH" }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $msbuild)

      - name: Smoke exact .NET Framework 4.8 Release package
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $package = Get-ChildItem "$env:RUNNER_TEMP/package/KairosBoot.*.nupkg" |
            Where-Object { $_.Extension -eq ".nupkg" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $package) { throw "KairosBoot Release NuGet package was not downloaded" }
          python bindings/dotnet/tests/run_package_smoke.py `
            --package $package `
            --framework net48 `
            --rid win-x64 `
            --expected-native-version "$env:VERSION"
          python bindings/dotnet/tests/run_package_smoke.py `
            --package $package `
            --framework net48 `
            --rid win-x64 `
            --classic `
            --expected-native-version "$env:VERSION"

  publish:
    name: publish-github-release
    needs:
      - verify
      - native-linux
      - native-desktop
      - dotnet-package
      - dotnet-package-smoke
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download native release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Assemble source, notices, dependency sources, SBOM, and provenance
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
          SIGNING_MODE: off
        run: |
          set -eu
          git archive --format=tar.gz --prefix="KairosBoot-v${VERSION}/" \
            --output="release-assets/KairosBoot-v${VERSION}-source.tar.gz" "$COMMIT"
          curl --fail --silent --show-error --location \
            --output release-assets/libusb-1.0.30.tar.bz2 \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          printf '%s  %s\n' \
            'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf' \
            'release-assets/libusb-1.0.30.tar.bz2' | sha256sum --check
          tar -xOf release-assets/libusb-1.0.30.tar.bz2 \
            libusb-1.0.30/COPYING \
            >release-assets/libusb-1.0.30-COPYING
          test -s release-assets/libusb-1.0.30-COPYING
          curl --fail --silent --show-error --location \
            --output release-assets/boost-1.92.0-cmake.tar.xz \
            https://github.com/boostorg/boost/releases/download/boost-1.92.0/boost-1.92.0-cmake.tar.xz
          printf '%s  %s\n' \
            '9bed76128d4e46755dbe818487788c6fceb6f72b378f4daa49b7e1e600d9088d' \
            'release-assets/boost-1.92.0-cmake.tar.xz' | sha256sum --check
          tar -xOf release-assets/boost-1.92.0-cmake.tar.xz \
            boost-1.92.0/LICENSE_1_0.txt \
            >release-assets/Boost-1.92.0-LICENSE_1_0.txt
          curl --fail --silent --show-error --location \
            --output release-assets/miniz-3.1.2.zip \
            https://github.com/richgel999/miniz/releases/download/3.1.2/miniz-3.1.2.zip
          printf '%s  %s\n' \
            'f0446d863f9c19926ad9483c523fdc42e42b8d4a6a431d27e09d49c79a140d9a' \
            'release-assets/miniz-3.1.2.zip' | sha256sum --check
          python3 -c 'import sys, zipfile; archive = zipfile.ZipFile(sys.argv[1]); open(sys.argv[2], "wb").write(archive.read("LICENSE"))' \
            release-assets/miniz-3.1.2.zip \
            release-assets/miniz-3.1.2-LICENSE
          test -s release-assets/miniz-3.1.2-LICENSE
          curl --fail --silent --show-error --location \
            --output release-assets/yaml-cpp-0.9.0.tar.gz \
            https://github.com/jbeder/yaml-cpp/releases/download/yaml-cpp-0.9.0/yaml-cpp-yaml-cpp-0.9.0.tar.gz
          printf '%s  %s\n' \
            '298593d9c440fd9034b8b193d96318b76d49bc97c6ceadb7b0836edf0b6d7539' \
            'release-assets/yaml-cpp-0.9.0.tar.gz' | sha256sum --check
          tar -xOf release-assets/yaml-cpp-0.9.0.tar.gz LICENSE \
            >release-assets/yaml-cpp-0.9.0-LICENSE
          test -s release-assets/yaml-cpp-0.9.0-LICENSE
          cp LICENSE "release-assets/KairosBoot-v${VERSION}-LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "release-assets/KairosBoot-v${VERSION}-THIRD_PARTY_NOTICES.md"
          cp UNSIGNED.txt "release-assets/KairosBoot-v${VERSION}-UNSIGNED.txt"
          cp signing-status.json release-assets/signing-status.json
          python3 scripts/check_release_assets.py \
            --assets release-assets \
            --version "$VERSION" \
            --write-manifest
          python3 scripts/generate_sbom.py \
            --version "$VERSION" \
            --source-archive "release-assets/KairosBoot-v${VERSION}-source.tar.gz" \
            --libusb-source release-assets/libusb-1.0.30.tar.bz2 \
            --boost-source release-assets/boost-1.92.0-cmake.tar.xz \
            --miniz-source release-assets/miniz-3.1.2.zip \
            --yaml-cpp-source release-assets/yaml-cpp-0.9.0.tar.gz \
            --output release-assets/KairosBoot.spdx.json
          python3 scripts/generate_provenance.py \
            --assets release-assets \
            --output release-assets/provenance.intoto.json \
            --signing-mode "$SIGNING_MODE" \
            --commit "$COMMIT"
          python3 scripts/check_release_assets.py \
            --assets release-assets \
            --version "$VERSION" \
            --signing-mode "$SIGNING_MODE" \
            --write-checksums
          python3 scripts/check_release_assets.py \
            --assets release-assets \
            --version "$VERSION" \
            --signing-mode "$SIGNING_MODE" \
            --commit "$COMMIT" \
            --validate

      - name: Attest assembled release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*

      - name: Create draft, upload, redownload, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" --json isDraft --jq '.isDraft' >existing-draft; then
            if [ "$(cat existing-draft)" != "true" ]; then
              echo "refusing to replace an already-published release"
              exit 1
            fi
            gh release view "$TAG" --json assets --jq '.assets[].name' | \
              while IFS= read -r asset; do
                gh release delete-asset "$TAG" "$asset" --yes
              done
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "KairosBoot $TAG"
          fi
          find release-assets -maxdepth 1 -type f -printf '%f\n' | \
            LC_ALL=C sort >expected-assets.txt
          gh release upload "$TAG" release-assets/* --clobber
          mkdir verified-assets
          gh release download "$TAG" --dir verified-assets
          find verified-assets -maxdepth 1 -type f -printf '%f\n' | \
            LC_ALL=C sort >actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          cd verified-assets
          sha256sum --check SHA256SUMS
          cd ..
          gh release edit "$TAG" --draft=false
