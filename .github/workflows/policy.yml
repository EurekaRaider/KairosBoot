name: Policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate repository invariants
        run: python3 scripts/check_repository_policy.py

      - name: Validate patch whitespace
        run: git diff --check

  codeql:
    name: codeql-cpp
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare locked dynamic libusb
        run: >-
          python3 scripts/prepare_libusb.py
          --prefix "${RUNNER_TEMP}/libusb"
          --platform linux
          --architecture x64

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: c-cpp

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          "-DKAIROSBOOT_LIBUSB_ROOT=${RUNNER_TEMP}/libusb"

      - name: Build
        run: cmake --build build --parallel

      - name: Validate ABI, symbols, dependency lock, and release notices
        run: >-
          ctest --test-dir build --output-on-failure
          -R 'abi_symbols|libusb_dependency_tooling|release_tooling'

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  sanitizers:
    name: sanitizer-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: asan-ubsan
            compile-flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            link-flags: -fsanitize=address,undefined
          - id: tsan
            compile-flags: -fsanitize=thread -fno-omit-frame-pointer
            link-flags: -fsanitize=thread
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      CC: gcc-12
      CXX: g++-12
      # The shutdown fault test deliberately roots callback state for process
      # lifetime. Normal-path allocation/free counts and HIL soak enforce leak
      # freedom; ASan still covers bounds and lifetime errors here.
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - name: Install fixed sanitizer prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            binutils ca-certificates cmake g++-12 git make ninja-build python3

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare locked dynamic libusb
        run: >-
          python3 scripts/prepare_libusb.py
          --prefix "${RUNNER_TEMP}/libusb"
          --platform linux
          --architecture x64

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build-sanitizer -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          "-DKAIROSBOOT_LIBUSB_ROOT=${RUNNER_TEMP}/libusb"
          "-DCMAKE_C_FLAGS=${{ matrix.compile-flags }}"
          "-DCMAKE_CXX_FLAGS=${{ matrix.compile-flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.link-flags }}"
          "-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.link-flags }}"

      - name: Build and test with sanitizer
        run: |
          cmake --build build-sanitizer --parallel
          ctest --test-dir build-sanitizer --output-on-failure

  policy:
    name: policy
    if: always()
    needs:
      - repository-policy
      - codeql
      - sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Require all policy jobs
        env:
          REPOSITORY_POLICY_RESULT: ${{ needs.repository-policy.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        run: |
          if [ "$REPOSITORY_POLICY_RESULT" != "success" ] || \
             [ "$CODEQL_RESULT" != "success" ] || \
             [ "$SANITIZER_RESULT" != "success" ]; then
            echo "repository policy result: $REPOSITORY_POLICY_RESULT"
            echo "CodeQL result: $CODEQL_RESULT"
            echo "sanitizer result: $SANITIZER_RESULT"
            exit 1
          fi
